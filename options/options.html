<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>X 书签 AI 分类 — 设置</title>
  <style>
    body { font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #0f1419; }
    h1 { font-size: 20px; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    select, input[type="text"], input[type="password"] {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;
    }
    .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; }
    button {
      padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    #saveBtn { background: #1d9bf0; color: #fff; }
    #testBtn { background: #fff; color: #1d9bf0; border: 1px solid #1d9bf0; }
    #status { font-size: 13px; }
    #status.ok { color: #22a06b; }
    #status.err { color: #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>X 书签 AI 分类 — 设置</h1>

  <div class="field">
    <label for="provider">AI 提供商</label>
    <select id="provider"></select>
  </div>

  <div class="field" id="apiKeyField">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div class="hint" id="apiKeyHint"></div>
  </div>

  <div class="field">
    <label for="model">模型</label>
    <select id="model"></select>
    <div class="hint">也可直接在列表中输入自定义模型名（编辑前先清空选择无效时可在下方 Base URL 处调整）。</div>
  </div>

  <div class="field">
    <label for="baseUrl">自定义 Base URL（可选）</label>
    <input type="text" id="baseUrl" placeholder="留空使用默认地址；可填代理或 OpenAI 兼容服务">
    <div class="hint">使用自定义地址时，浏览器会请求该域名的访问权限。</div>
  </div>

  <div class="field row">
    <button id="saveBtn">保存</button>
    <button id="testBtn">测试连接</button>
    <span id="status"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
