<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="gEHY9RI0U8W3jCOfNMGBOV">
<head data-page-node-id="ZmcVlYNrWpVIH8vv8i91uf">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="ZwlR6MwratdY0ShGLrY1CH" />
  <title>X Bookmarks Exporter — Settings</title>
  <link rel="stylesheet" href="options.css" data-page-node-id="kbvG2XhX3z8bZaaAfIEYv2" />

<body data-page-node-id="0MxtWCIV13tXc9XXgdMEly">
  <div class="container" data-page-node-id="KLcS0YhOWp8OALKLo72r1a">
    <h1 data-page-node-id="vnrrhoRGXw0wCxUiiQNQFk">Settings</h1>

    <div class="section" data-page-node-id="pNx2v71YFQsf8Y7AjSmiXQ">
      <h2 data-page-node-id="pEGtOhCJGBG10K7WOvmNn9">AI Provider (DeepSeek)</h2>
      <label for="aiApiKey" data-page-node-id="oqJ5GCj5nyKTzqT77PXXbK">API Key</label>
      <input type="password" id="aiApiKey" placeholder="sk-..." autocomplete="off" data-page-node-id="drj97nYW2EykhsvZDbl9f9" />
      <p class="hint" data-page-node-id="v9HXoiV2kj6pyxsc5uugRn">
        Used for auto-categorization and summarization.
        <a href="https://platform.deepseek.com" target="_blank" rel="noopener" data-page-node-id="1x68KMHfcdFhzHMQ6BZnCJ">Get a key</a>
      </p>
    </div>

    <div class="section" data-page-node-id="ILjKfvDAH8X73jgZih0GAs">
      <h2 data-page-node-id="q9sc75A9QdMDsRGuDrl7AE">Storage</h2>
      <label for="maxStorage" data-page-node-id="vnF3BVKgOc0IN3uwVlk6wP">Max stored bookmarks</label>
      <input type="number" id="maxStorage" min="100" max="10000" value="5000" data-page-node-id="W6B2TZHKaF0EURdWbEOfYd" />
      <p class="hint" data-page-node-id="CYB5q6oXxLt3D4hIlZSOAf">Oldest bookmarks are removed when limit is exceeded.</p>
    </div>

    <div class="section" data-page-node-id="ItlU4ysuZNgFDvrLOwNQbW">
      <h2 data-page-node-id="ivtjC9IidYNJsFE8hWhLmz">Behavior</h2>
      <label data-page-node-id="2JcaOCKnSbHpMLbqWbdP80">
        <input type="checkbox" id="autoCategorize" checked data-page-node-id="Dq9P74CEmgBfEKVuH2a3yD" />
        Auto-categorize new bookmarks with AI
      </label>
    </div>

    <div class="actions" data-page-node-id="BU06iaq3WehGFSy8ZNseDX">
      <button id="saveBtn" class="btn-primary" data-page-node-id="19ry7OQ2IyEpP6d8335PdE">Save</button>
      <span id="saveStatus" data-page-node-id="PmohzEQzZ02iGwDsADYZFQ"></span>
    </div>
  </div>

  <!-- FIX: settings.js must be loaded BEFORE options.js so XBE_SETTINGS is available -->
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
